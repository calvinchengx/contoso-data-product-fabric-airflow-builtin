[project]
name = "contoso-data-product-fabric-airflow-builtin"
version = "0.1.0"
description = "The Contoso data product for Fabric's built-in Apache Airflow (ApacheAirflowJob)"
requires-python = ">=3.12"
authors = [{name = "Calvin Cheng", email = "calvin@calvinx.com"}]

# WHAT THE BUILT-IN AIRFLOW MUST IMPORT. The platform installs exactly this
# into the sidecar, the same way fabric-platform-airflow3 builds its worker
# from the product's pyproject.toml -- a product declares its dependencies and
# a platform provides them.
#
# On REAL Fabric this is the "install private package as requirement" feature
# of an Apache Airflow job. The emulator has no equivalent yet -- it syncs .py
# files and nothing else -- so the platform bakes them into the sidecar image
# instead. Same outcome, different mechanism, and the difference is recorded
# rather than hidden (fabric-emulator#323).
dependencies = [
    "requests>=2.32,<3",
    # Bronze is written by delta-rs, not Spark: an Airflow worker has no Spark
    # session, and this is the writer the emulator is already witnessed
    # against. The Airflow 3 leaf settled this and the reasoning is unchanged
    # by the Airflow version.
    "deltalake>=0.23,<2",
    # >=23, AND THE FLOOR IS THE POINT. The reference vendor's Parquet carries
    # SizeStatistics, and pyarrow 19 cannot read them: it raises
    # `OSError: Repetition level histogram size mismatch` on a file whose
    # published sha256 verifies and whose PAR1 markers are intact -- so the
    # bytes are perfect and the reader is wrong.
    #
    # THE FLOOR MATTERS BECAUSE THE BASE IMAGE PRE-INSTALLS ONE. apache/airflow
    # ships pyarrow 19.0.0, which satisfied the old `>=18` and so was left in
    # place -- `uv pip install` upgrades nothing that already meets the
    # constraint. Resolving this same file standalone gives 23.0.1 and works.
    # A range that is satisfied by a version that cannot do the job is a range
    # that expresses the wrong requirement.
    #
    # 23.0.1 is measured: it reads the vendor's fx_rates as 132 rows x 3
    # columns where 19.0.0 raises on the identical bytes. Lower this if a
    # version between is tested and works.
    "pyarrow>=23,<24",
    # SILVER'S MODELS COME FROM HERE, not from this repo. The dbt project lives
    # in contoso-data-product precisely so it is not copied per cell, and
    # depending on the package is the whole point of it being one. The DAG
    # resolves it with `silver_dir()` at run time and points dbt there.
    #
    # This is the line that would be easiest to omit while copying the models
    # in instead -- and doing so is the defect the entire family is built to
    # prevent, in the one place a rewrite makes it tempting.
    "contoso-data-product",
    # SILVER LANDS IN THE LAKEHOUSE over Livy: the emulator terminates it and
    # Sail computes. The Airflow worker holds no Spark session at any point.
    "dbt-core>=1.9,<2",
    "dbt-fabricspark>=1.9,<2",
    # GOLD IS A WAREHOUSE, reached over TDS. dbt-fabric now uses Microsoft's
    # `mssql-python`, which BUNDLES the ODBC Driver 18 binaries inside the
    # wheel -- so no system-level driver install is needed in this image, on a
    # CI runner, or on a laptop. That is what makes gold reachable from
    # Fabric's own Airflow sidecar at all: the alternative was putting a native
    # driver into an image this platform does not own.
    "dbt-fabric>=1.9,<2",
    "mssql-python>=1.0,<2",
    # THE ERP VENDOR IS A CHANGE STREAM, so a Kafka client is the only way to
    # consume it. Reading erp.customer directly would be a snapshot -- and a
    # snapshot cannot say that a customer was in Germany before they were in
    # France, which is the whole reason this vendor is in the product.
    "confluent-kafka>=2.5,<3",
    # Not for ingest: the CDC step reconciles the stream's net effect against
    # the ERP's own row count, because a connector that stopped early produces
    # a stream that is stable, well-formed, and short.
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.16"]

[tool.uv.sources]
# THE PUBLISHED WHEEL, not a git tag and not a sibling path.
#
# Not a path, because a path resolves only from a checkout that happens to have
# both repos side by side and the sidecar image receives this product's
# directory and nothing else.
#
# Not a git tag either, and that is measured rather than preferred: the Airflow
# image has no `git`, so uv fails the build with "Git executable not found".
# Installing git to fetch a package that is already published as a wheel would
# be adding a build dependency to work around not using the artifact. A release
# wheel is also what production pins.
contoso-data-product = { url = "https://github.com/calvinchengx/contoso-data-product/releases/download/v0.2.0/contoso_data_product-0.2.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
